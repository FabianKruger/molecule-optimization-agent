name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-changed-python:
    name: Ruff and ty on changed Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Collect changed Python files
        id: changed
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- '*.py' > changed-py.txt
          # ty is limited to the package and tests for now.
          grep -E '^(src|tests)/' changed-py.txt > ty-py.txt || true
          if [[ -s changed-py.txt ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "Changed Python files:"
            cat changed-py.txt
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No changed Python files."
          fi
          if [[ -s ty-py.txt ]]; then
            echo "ty=true" >> "$GITHUB_OUTPUT"
            echo "Python files for ty:"
            cat ty-py.txt
          else
            echo "ty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Pixi
        if: steps.changed.outputs.any == 'true'
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: lint
          cache: true

      - name: Ruff check
        if: steps.changed.outputs.any == 'true'
        run: xargs -d '\n' -r pixi run -e lint -- ruff check --output-format=github < changed-py.txt

      - name: Ruff format
        if: steps.changed.outputs.any == 'true'
        run: xargs -d '\n' -r pixi run -e lint -- ruff format --check --diff < changed-py.txt

      - name: ty check
        if: steps.changed.outputs.ty == 'true'
        run: xargs -d '\n' -r pixi run -e lint -- ty check --output-format=github < ty-py.txt
