[project]
authors = [{name = "Fabian", email = "132886103+FabianKruger@users.noreply.github.com"}]
# certifi was a direct dep but nothing imports it; CA bundles still arrive via httpx/requests.
dependencies = ["shap>=0.50.0,<0.51"]
name = "seismo"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
seismo = "seismo.main:main"
seismo-ui = "seismo.ui.app:main"
seismo-api = "seismo.api.app:main"
molopt = "seismo.cli.deprecated:molopt_main"
molopt-ui = "seismo.cli.deprecated:molopt_ui_main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/seismo", "src/molopt_agent"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  "osx-arm64",
  "linux-64",
  # manylinux_2_31 wheels (llguidance, pulled in by vLLM) need glibc >= 2.31.
  # Only the vllm environment selects this entry.
  { name = "linux-64-glibc-2-35", platform = "linux-64", glibc = "2.35" },
  { name = "linux-64-cuda", platform = "linux-64", cuda = "13" },
]

[tool.pixi.pypi-dependencies]
seismo = { path = ".", editable = true }
gradio = ">=4.0"

[tool.pixi.target.linux-64.dependencies]
python = "3.13.*"

[tool.pixi.target.osx-arm64.dependencies]
python = "3.13.*"

[tool.pixi.dependencies]
langgraph = ">=1.2,<2"
transformers = ">=4.57.3,<5"
rdkit = ">=2025.9.3,<2026"
langchain-openai = ">=0.3.35,<2"
python-dotenv = ">=1.2.1,<2"
pyyaml = ">=6.0.3,<7"
pytorch = "*"
xgboost = ">=3.1.2,<4"
matplotlib = "*"  # used by src/seismo/save_experiment.py (was transitive via seaborn)
pillow = ">=10.0,<12"  # gradio requires pillow<12
pydantic = ">=2.0,<2.12.5"  # gradio 6.x requires pydantic<=2.12.4
biotite = ">=1.5"
scikit-learn = ">=1.8"
pytest = ">=8"
fastapi = ">=0.115"
# conda-forge equivalent of the PyPI uvicorn[standard] extra; depends on uvicorn
uvicorn-standard = ">=0.32"

# TDC environment - isolated to avoid sklearn version conflicts
# sklearn<1.3 needed for TDC's pickled models (jnk3, gsk3b)
# pytdc from pip (>=0.4.1) fixes rmsd import bug in conda-forge version (0.3.8)
[tool.pixi.feature.tdc]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.tdc.dependencies]
python = ">=3.10"
rdkit = "*"
scikit-learn = "<1.3"
networkx = "*"

[tool.pixi.feature.tdc.pypi-dependencies]
pytdc = ">=0.4.1"

[tool.pixi.feature.boltz2]
platforms = ["linux-64-cuda"]

[tool.pixi.feature.boltz2.dependencies]
python = ">=3.10,<3.13"
numpy = "*"
scipy = "*"
pandas = "*"
scikit-learn = "*"
pytorch = "*"
pytorch-lightning = "*"
einops = "*"
einx = "*"
dm-tree = "*"
numba = "*"
rdkit = "*"
gemmi = "*"
biopython = "*"
modelcif = "*"
chembl_structure_pipeline = "*"
mashumaro = "*"
hydra-core = "*"
wandb = "*"
click = "*"
pyyaml = "*"
requests = "*"
types-requests = "*"
ninja = "*"
cuda-minimal-build = "*"
pytorch-gpu = "*"
cuda-version = ">=13,<14"

[tool.pixi.feature.boltz2.pypi-dependencies]
# boltz = { version = ">=2.2.1", extras = ["cuda"] }
boltz-community = { git = "https://github.com/Novel-Therapeutics/boltz-community.git", extras = ["cuda"] }
cuequivariance = ">=0.8"
cuequivariance-torch = ">=0.8"
cuequivariance-ops-torch-cu13 = ">=0.8"

# [tool.pixi.feature.boltz2.target.osx.pypi-dependencies]
# boltz-community = { git = "https://github.com/Novel-Therapeutics/boltz-community.git" }

[tool.pixi.feature.boltz2.activation]
env.TRITON_PTXAS_PATH = "$CONDA_PREFIX/bin/ptxas"
env.TRITON_PTXAS_BLACKWELL_PATH = "$TRITON_PTXAS_PATH"
env.CUEQ_TRITON_CACHE_DIR = "$CONDA_PREFIX/caches/cuequivariance-triton"
# Change triton cache to be isolated
env.TRITON_CACHE_DIR = "$CONDA_PREFIX/caches/triton"
# Change torch extensions cache, used by deepspeed, to be isolated
env.TORCH_EXTENSIONS_DIR = "$CONDA_PREFIX/caches/torch_extensions"

# Paper notebooks (Jupyter + marimo), analysis/paper scripts, and
# scripts/xgboost_training.py. Kept off default so pixi run seismo /
# seismo-ui / seismo-api stay lean. Use: pixi run -e analysis …
# polaris>=0.13 needs python<=3.12 on conda-forge; with default python 3.13
# the solver picks 0.2.x. Tighten later if analysis moves off 3.13.
[tool.pixi.feature.analysis]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.analysis.dependencies]
ipykernel = ">=7.1.0,<8"
jupyterlab = ">=4.5.0,<5"
seaborn = ">=0.13.2"
anthropic = "*"
umap-learn = ">=0.5.11,<0.6"
mcp = ">=2.3.0,<3"
polaris = "*"
marimo = "*"
altair = "*"
altair_saver = "*"
polars = "*"
ruff = "*"
vl-convert-python = "*"
# marimo accepts tomlkit>=0.12; gradio (default) needs <0.15
tomlkit = ">=0.12.0,<0.15.0"

# Vite React app under frontend/. Kept off default so Python-only workflows
# do not pull Node. Use: pixi run frontend / pixi run frontend-build
[tool.pixi.feature.frontend]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.frontend.dependencies]
nodejs = ">=22"

[tool.pixi.feature.frontend.tasks]
frontend-install = { cmd = "npm install", cwd = "frontend" }
frontend = { cmd = "npm run dev", cwd = "frontend", depends-on = ["frontend-install"] }
frontend-build = { cmd = "npm run build", cwd = "frontend", depends-on = ["frontend-install"] }

[tool.pixi.feature.lint]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.lint.dependencies]
python = "3.13.*"
ruff = "*"
ty = "*"
# Present so ty can resolve the API imports. fastapi-core is the library;
# the fastapi metapackage only adds CLI and optional servers.
fastapi-core = ">=0.115"
uvicorn = ">=0.32"

# Import closure of src/ and tests/ for ty. Intentionally omits notebook and
# paper tools (jupyterlab, ipykernel, seaborn, umap-learn, anthropic); see #28.
[tool.pixi.feature.ty]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.feature.ty.dependencies]
python = "3.13.*"
ty = "*"
langgraph = ">=1.2,<2"
transformers = ">=4.57.3,<5"
rdkit = ">=2025.9.3,<2026"
langchain-openai = ">=0.3.35,<2"
python-dotenv = ">=1.2.1,<2"
pyyaml = ">=6.0.3,<7"
pytorch = "*"
xgboost = ">=3.1.2,<4"
pillow = ">=10.0,<12"  # gradio requires pillow<12
pydantic = ">=2.0,<2.12.5"  # gradio 6.x requires pydantic<=2.12.4
biotite = ">=1.5"
scikit-learn = ">=1.8"
shap = ">=0.50.0,<0.51"
matplotlib = "*"
pytest = ">=8"
fastapi = ">=0.115"
# conda-forge equivalent of the PyPI uvicorn[standard] extra; depends on uvicorn
uvicorn-standard = ">=0.32"

[tool.pixi.feature.ty.pypi-dependencies]
gradio = ">=4.0"

# Linux CUDA serving only. Does not inherit the harness or Boltz-2 stacks.
# PyPI vLLM 0.30 depends on torch 2.13, whose Linux wheels are CUDA 13
# (the stack vLLM recommends for B300). Do not module-load a cluster CUDA
# into this env, and do not add conda pytorch (it statically links NCCL).
[tool.pixi.feature.vllm]
platforms = ["linux-64-glibc-2-35"]

[tool.pixi.feature.vllm.dependencies]
python = "3.12.*"

[tool.pixi.feature.vllm.pypi-dependencies]
vllm = ">=0.30.0,<0.31"

[tool.pixi.feature.vllm.pypi-options]
# Wheels only. A source build needs nvcc; that is the container fallback.
no-build = true

[tool.pixi.environments]
default = { features = [], solve-group = "default", platforms = ["osx-arm64", "linux-64"] }
# Default deps plus notebook/paper packages (Jupyter, marimo, plotting, polaris).
# Own solve-group so marimo's websockets pin does not reshape the default lock.
analysis = { features = ["analysis"], solve-group = "analysis" }
tdc = { features = ["tdc"], solve-group = "tdc", no-default-feature = true }
boltz2 = { features = ["boltz2"], solve-group = "boltz2", no-default-feature = true }
frontend = { features = ["frontend"], no-default-feature = true }
lint = { features = ["lint"], no-default-feature = true }
ty = { features = ["ty"], no-default-feature = true }
vllm = { features = ["vllm"], solve-group = "vllm", no-default-feature = true }

# These tasks read SEISMO_LLM_PROFILE and SEISMO_LLM_WEIGHTS_DIR and do not
# pass those as CLI flags. download-llm only downloads. load-check-llm only
# health-checks; it does not download and does not depend on download-llm.
# load-check-llm and bootstrap-llm also read SEISMO_LLM_CACHE_DIR and set it
# as VLLM_CACHE_ROOT on the server (torch.compile cache included). Absolute
# path, not inside $HOME. bootstrap-llm's only argument is the experiment YAML.
[tool.pixi.tasks]
download-llm = { cmd = "python scripts/local_llm/download.py", description = "Download the local LLM snapshot for SEISMO_LLM_PROFILE into SEISMO_LLM_WEIGHTS_DIR" }
load-check-llm = { cmd = "python scripts/local_llm/download.py --load-check", description = "Health-check the SEISMO_LLM_PROFILE snapshot in SEISMO_LLM_WEIGHTS_DIR until /health, then stop vLLM" }

[tool.pixi.tasks.bootstrap-llm]
cmd = [
  "python",
  "scripts/local_llm/bootstrap.py",
  "--config",
  "{{ config }}",
]
args = ["config"]
description = "Serve SEISMO_LLM_PROFILE and run one seismo experiment. The only argument is the experiment YAML."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
# Starter set for an existing codebase: correctness first, then import order.
# Expand later (B, UP, SIM, …) once the tree is closer to clean.
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "I", # isort
]
ignore = [
    "E501", # line length is enforced by `ruff format`
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
all = "warn"

[tool.ty.terminal]
# Warnings stay visible and do not fail local runs or CI yet.
error-on-warning = false

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
# Packages not installed in the ty environment (optional oracles, notebooks,
# paper tools). First-party imports under src/ remain checked.
allowed-unresolved-imports = [
    "anthropic.**",
    "boltz.**",
    "marimo.**",
    "molopt.**",
    "pandas.**",
    "polaris.**",
    "seaborn.**",
    "tdc.**",
    "umap.**",
]
