[project]
authors = [{name = "Fabian", email = "132886103+FabianKruger@users.noreply.github.com"}]
dependencies = ["shap>=0.50.0,<0.51", "certifi"]
name = "molopt_agent"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
molopt = "molopt_agent.main:main"
molopt-ui = "molopt_agent.ui.app:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
molopt_agent = { path = ".", editable = true }
gradio = ">=4.0"

[tool.pixi.target.linux-64.dependencies]
python = "3.13.*"

[tool.pixi.target.osx-arm64.dependencies]
python = "3.13.*"

[tool.pixi.dependencies]
langgraph = ">=1.2,<2"
transformers = ">=4.57.3,<5"
rdkit = ">=2025.9.3,<2026"
langchain-openai = ">=0.3.35,<2"
python-dotenv = ">=1.2.1,<2"
pyyaml = ">=6.0.3,<7"
pytorch = "*"
xgboost = ">=3.1.2,<4"
ipykernel = ">=7.1.0,<8"
jupyterlab = ">=4.5.0,<5"
seaborn = ">=0.13.2"
pillow = ">=10.0,<12"  # gradio requires pillow<12
pydantic = ">=2.0,<2.12.5"  # gradio 6.x requires pydantic<=2.12.4
biotite = ">=1.5"
scikit-learn = ">=1.8"
anthropic = "*"
umap-learn = ">=0.5.11,<0.6"

# TDC environment - isolated to avoid sklearn version conflicts
# sklearn<1.3 needed for TDC's pickled models (jnk3, gsk3b)
# pytdc from pip (>=0.4.1) fixes rmsd import bug in conda-forge version (0.3.8)
[tool.pixi.feature.tdc.dependencies]
python = ">=3.10"
rdkit = "*"
scikit-learn = "<1.3"
networkx = "*"

[tool.pixi.feature.tdc.pypi-dependencies]
pytdc = ">=0.4.1"

[tool.pixi.feature.boltz2.dependencies]
python = ">=3.10,<3.13"

[tool.pixi.feature.boltz2.pypi-dependencies]
boltz = { version = ">=2.2.1", extras = ["cuda"] }

[tool.pixi.feature.boltz2.target.osx.pypi-dependencies]
boltz = { version = ">=2.2.1"}

[tool.pixi.feature.marimo.dependencies]
marimo = "*"
altair = "*"
altair_saver = "*"
polars = "*"
ruff = "*"
vl-convert-python = "*"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
tdc = { features = ["tdc"], solve-group = "tdc", no-default-feature = true }
boltz2 = { features = ["boltz2"], solve-group = "boltz2", no-default-feature = true }
marimo = { features = ["marimo"], solve-group = "marimo", no-default-feature = true}
