experiment_name: composite_test

log_dir: data/runs/composite_test
recursion_limit: 300

llm:
  model: claude-opus-4.5
  temperature: 0.1

oracle:
  name: composite
  params:
    oracles:
      - name: ic50mpro
        params:
          model_name: "data/xgboost/xgb_maccs_best"
      - name: qed
        params: {}
      - name: novel
        params: {}
    weights: [1.0, 0.0, 0.0]
    names: ["IC50", "QED", "Novelty"]

objective:
  name: ic50mpro_qed_novel
  params:
    target_ic50_nM: 10.0
    min_qed: 0.6
    max_iterations: 3
    xai: no_description