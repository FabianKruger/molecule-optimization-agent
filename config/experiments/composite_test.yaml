experiment_name: composite_test

log_dir: data/runs/composite_test
recursion_limit: 300

llm:
  model: gpt-4o
  temperature: 0.1

oracle:
  name: composite
  params:
    oracles:
      - name: ic50mpro
        params:
          model_name: "src/xgboost_training/xgb_maccs_best"
      - name: qed
        params: {}
      - name: novel
        params: {}
    weights: [0.5, 0.5, 0.0]
    names: ["IC50", "QED", "Novelty"]

objective:
  name: ic50mpro_qed_novel
  params:
    target_ic50_nM: 20.0
    min_qed: 0.5
    max_iterations: 4
    xai: full