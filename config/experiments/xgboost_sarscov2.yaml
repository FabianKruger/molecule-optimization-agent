experiment_name: sarscov2_ic50

log_dir: data/runs
recursion_limit: 100

llm:
  model: gpt-5.1
  temperature: 0.3
  api_key_env: OPENAI_API_KEY

oracle:
  name: xgboost_sarscov2
  params:
    model_name: "src/xgboost_training/xgb_maccs_best"

objective:
  name: xgboost_sarscov2
  params:
    target_ic50_nM: 10.0
    max_iterations: 20
