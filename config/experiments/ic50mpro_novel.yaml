experiment_name: ic50mpro_novel_optimization

log_dir: data/runs
recursion_limit: 100

llm:
  model: gpt-5.1
  temperature: 0.3

oracle:
  name: composite
  params:
    oracles:
      - name: ic50mpro
        params:
          model_name: "data/xgboost/xgb_maccs_best"
      - name: novel
        params: {}
    weights: [1.0, 0.0]  # Only IC50 contributes to score; novelty is a constraint
    names: ["IC50", "Novelty"]

objective:
  name: ic50mpro_novel
  params:
    target_ic50_nM: 10.0
    max_iterations: 20
    xai: full  # "full" or "none"
