experiment_name: boltz2_binding_optimization

log_dir: data/runs
recursion_limit: 500

llm:
  model: claude-opus-4.5
  temperature: 0.1
  reasoning_effort: None

oracle:
  name: boltz2
  params:
    # optimize binder for SARS-CoV-2 main protease
    # FASTA sequence from PDB (https://www.rcsb.org/structure/7CAM)
    protein_sequence: "ILRRYCMEEPAQALIDQLAAQLEADNWELAPLFKTLFMSEAFYSQIARTGFIKSPVEHALGFIHATGMTVQLERGNIGFGFENGLDRFFNDMDNRPTQPPVVDGWPEGTGWLSAQALVDRANMLEFITASRDFQASEGFNVASLLPAGTPTAEQVVESLALLLGITLTAPEVADLAAYLGKDNSGVADPFDPSNTAQVEERVRGLLYILGQHPQYMLR"
    output_dir_base: data/boltz2_mgyp001550541752_no_explanation_no_protein_08
    binding_score_name: affinity_probability_binary # Options: affinity_probability_binary (optimize probability), affinity_pred_value (optimize affinity with target_binding_probability constraint)
    with_explanation: false
    transform_probability: "none"

objective:
  name: boltz2
  params:
    target_binding_probability: 0.999
    max_iterations: 50
