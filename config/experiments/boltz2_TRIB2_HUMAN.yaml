experiment_name: boltz2_binding_optimization_trib2

log_dir: data/runs
recursion_limit: 500

llm:
  model: claude-opus-4.5
  temperature: 0.1
  reasoning_effort: None

oracle:
  name: boltz2
  params:
    # optimize binder for TRIB2_HUMAN
    # FASTA sequence from UniProt (https://mobidb.org/entries/Q92519)
    protein_sequence: 
    output_dir_base: boltz2_trib2_human3
    binding_score_name: affinity_probability_binary # Options: affinity_probability_binary (optimize probability), affinity_pred_value (optimize affinity with target_binding_probability constraint)
    with_explanation: true
    timeout: 900

objective:
  name: boltz2
  params:
    target_binding_probability: 0.999
    max_iterations: 50
    additional_information: ""
