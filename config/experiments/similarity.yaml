experiment_name: similarity_optimization

log_dir: data/runs
recursion_limit: 100

llm:
  model: gpt-5.1
  temperature: 0.3

oracle:
  name: similarity
  params:
    target_smiles: "CC(=O)Oc1ccccc1C(=O)O"  # Aspirin

objective:
  name: similarity
  params:
    target_similarity: 0.9
    max_iterations: 20
