experiment_name: similarity_and_qed_optimization

log_dir: data/runs
recursion_limit: 100

llm:
  model: gpt-5.1
  temperature: 0.3
  api_key_env: OPENAI_API_KEY

oracle:
  name: composite
  params:
    oracles:
      - name: tanimoto_similarity
        params:
          target_smiles: "CC(=O)Oc1ccccc1C(=O)O"  # aspirin
      - name: qed
        params: {}
    weights: [0.5, 0.5]
    names: ["Similarity", "QED"]

objective:
  name: similarity_and_qed
  params:
    target_score: 0.7
    min_similarity: 0.6
    min_qed: 0.6
    max_iterations: 20
    xai: full  # "full", "partial" (QED only), or "none"

