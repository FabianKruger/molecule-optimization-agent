experiment_name: similarity_and_qed_optimization

log_dir: data/runs
recursion_limit: 150

llm:
  model: gpt-5.1
  temperature: 0.3

oracle:
  name: composite
  params:
    oracles:
      - name: tanimoto_similarity
        params:
          target_smiles: O=C1c3c(O/C(=C1/O)c2ccc(O)c(O)c2)cc(O)cc3O  # Quercetin
      - name: qed
        params: {}
    weights: [0.5, 0.5]
    names: ["Similarity", "QED"]

objective:
  name: similarity_and_qed
  params:
    target_score: 0.75
    min_similarity: 0.7
    min_qed: 0.7
    max_iterations: 30
    xai: full  # "full", "partial" (QED only), or "none"

