experiment_name: ic50mpro_optimization

log_dir: data/runs
recursion_limit: 100

llm:
  model: claude-opus-4.5
  temperature: 0.1
  api_key_env: OPENAI_API_KEY

oracle:
  name: ic50mpro
  params:
    model_name: "src/xgboost_training/xgb_maccs_best"

objective:
  name: ic50mpro
  params:
    target_ic50_nM: 10.0
    max_iterations: 2
